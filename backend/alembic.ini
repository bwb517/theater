[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = alembic

# Add the directory containing this file (backend/) to sys.path so that
# env.py can import database, models, etc. without a venv-relative hack.
prepend_sys_path = .

# Naming convention for revision files: YYYYMMDD_<revid>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Placeholder URL — overridden in env.py from DATABASE_URL env var or Settings.
# Local dev default: SQLite next to main.py.
sqlalchemy.url = sqlite:///./theater.db

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
