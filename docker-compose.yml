services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - db_data:/data
    expose:
      - "8000"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      # Set to your domain (e.g. theater.example.com) to enable automatic HTTPS.
      # Leave unset for local HTTP-only on :80.
      - SITE_ADDRESS=${SITE_ADDRESS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:
